<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ver57 台車・資材室の確認</title><style>body{margin:0;font:16px system-ui;background:#e9ece5;color:#183d35}#stage{position:fixed;inset:0;touch-action:none}header{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px;background:#fffffff0}button{font:inherit;border:1px solid #b3c2b9;border-radius:10px;background:white;padding:9px 14px;color:#214638}button.on{background:#245c4c;color:white}p{position:fixed;bottom:0;left:0;right:0;margin:0;padding:10px;background:#fffffff0;text-align:center;font-size:13px}</style><div id="stage"></div><header><strong>ver57 確認用</strong><button data-view="cart">空の台車</button><button data-view="room">資材の部屋</button><button data-view="door">扉と消火器</button><button id="wide" aria-pressed="false">広角</button></header><p>写真を参考にした形状。実寸は未測定のため近似です。実際の保存データは使いません。</p><script src="vendor/three-r128.min.js"></script><script src="warehouse-materials.js"></script><script src="warehouse-ver57.js"></script><script src="warehouse3d.js"></script><script src="warehouse-walk.js"></script><script>
(async()=>{await WarehouseMaterials.load();const db={maps:{floors:[{name:'確認',cols:24,rows:20,floor:'green',annex:false,rects:[{id:1,type:'cartbay',label:'台車置き場',x:2,y:5,w:5,h:2},{id:2,label:'資材',x:9,y:1,w:12,h:4},{id:3,pal:true,x:9,y:5,w:4,h:1},{id:4,pal:true,x:15,y:5,w:6,h:1},{id:5,type:'door',label:'扉',x:0,y:11,w:1,h:2}]}]},spots:{}};const views={cart:{x:14,z:20,yaw:.63,pitch:-.17},room:{x:28,z:27,yaw:0,pitch:0},door:{x:13,z:26,yaw:Math.PI/2,pitch:-.12}};let wide=false,walk;
function view(name){walk?.destroy();walk=WarehouseWalk.create(document.getElementById('stage'),db,0,{position:views[name],wide});window.ver57Preview=walk;document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===name));}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>view(b.dataset.view));document.getElementById('wide').onclick=e=>{wide=!wide;walk.setWide(wide);e.target.setAttribute('aria-pressed',String(wide));e.target.classList.toggle('on',wide);};view('cart');})();
</script></html>
